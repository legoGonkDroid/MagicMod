#General settings
[general]
	#Is Enabled?
	enabled = true
	#Cost
	# Default: 500
	# Range: > -2147483648
	cost = 500
	#Is Starter Glyph?
	starter = false
	#The maximum number of times this glyph may appear in a single spell
	# Default: 2147483647
	# Range: > 1
	per_spell_limit = 2147483647
	#The tier of the glyph
	# Default: 3
	# Range: 1 ~ 99
	glyph_tier = 3
	#Limits the number of times a given augment may be applied to a given effect
	#Example entry: "glyph_amplify=5"
	augment_limits = ["ars_nouveau:glyph_duration_down=5", "ars_nouveau:glyph_amplify=5", "ars_nouveau:glyph_extend_time=5"]
	#How much an augment should cost when used on this effect or form. This overrides the default cost in the augment config.
	#Example entry: "glyph_amplify=50"
	augment_cost_overrides = []
	#Prevents the given glyph from being used in the same spell as the given glyph
	#Example entry: "glyph_burst"
	invalid_combos = []
	#Base duration of the Undying effect, in seconds
	# Default: 10
	# Range: 1 ~ 10000
	base_duration_seconds = 10
	#Seconds added/subtracted per Extend Time or Duration Down level
	# Default: 3
	# Range: 0 ~ 1000
	extend_time_per_level = 3
	#Health fraction of max health restored on revival
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	revive_health_percent = 0.1
	#Additional health fraction restored per Amplify level
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	revive_health_per_amplify = 0.05
