#General settings
[general]
	enabled = false
	#Cost
	# Default: 200
	# Range: > -2147483648
	cost = 200
	#Is Starter Glyph?
	starter = false
	#The maximum number of times this glyph may appear in a single spell
	# Default: 2147483647
	# Range: > 1
	per_spell_limit = 2147483647
	#The tier of the glyph
	# Default: 2
	# Range: 1 ~ 99
	glyph_tier = 2
	#Limits the number of times a given augment may be applied to a given effect
	#Example entry: "glyph_amplify=5"
	augment_limits = ["ars_nouveau:glyph_amplify=5", "ars_nouveau:glyph_dampen=5"]
	#How much an augment should cost when used on this effect or form. This overrides the default cost in the augment config.
	#Example entry: "glyph_amplify=50"
	augment_cost_overrides = []
	#Prevents the given glyph from being used in the same spell as the given glyph
	#Example entry: "glyph_burst"
	invalid_combos = []
	#Base fraction of target attributes mimicked
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	base_mimic_percent = 0.1
	#Extra mimic fraction per Amplify level
	# Default: 0.02
	# Range: 0.0 ~ 1.0
	amplify_multiplier = 0.02
	#Mimic fraction penalty per Dampen level
	# Default: 0.02
	# Range: 0.0 ~ 1.0
	dampen_multiplier = 0.02
	#Minimum mimic fraction (never below this)
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	min_mimic_percent = 0.01
	#Entity registry names (e.g. "minecraft:ender_dragon", "minecraft:wither") that cannot be mimicked. Casting on a blacklisted creature fails but mana is still consumed.
	mimicBlacklist = []
