#General settings
[general]
	#Is Enabled?
	enabled = true
	#Cost
	# Default: 80
	# Range: > -2147483648
	cost = 80
	#Is Starter Glyph?
	starter = false
	#The maximum number of times this glyph may appear in a single spell
	# Default: 2147483647
	# Range: > 1
	per_spell_limit = 2147483647
	#The tier of the glyph
	# Default: 3
	# Range: 1 ~ 99
	glyph_tier = 3
	#Limits the number of times a given augment may be applied to a given effect
	#Example entry: "glyph_amplify=5"
	augment_limits = ["ars_nouveau:glyph_amplify=3", "ars_nouveau:glyph_dampen=2"]
	#How much an augment should cost when used on this effect or form. This overrides the default cost in the augment config.
	#Example entry: "glyph_amplify=50"
	augment_cost_overrides = []
	#Prevents the given glyph from being used in the same spell as the given glyph
	#Example entry: "glyph_burst"
	invalid_combos = []
	#Fraction of the target's maximum health restored by Revival
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	base_percentage = 0.15
	#Additional healing fraction per Amplify level
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	amplify_bonus = 0.05
	#Healing fraction removed per Dampen level
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	dampen_penalty = 0.05
