#General settings
[general]
	#Is Enabled?
	enabled = true
	#Cost
	# Default: 40
	# Range: > -2147483648
	cost = 40
	#Is Starter Glyph?
	starter = false
	#The maximum number of times this glyph may appear in a single spell
	# Default: 2147483647
	# Range: > 1
	per_spell_limit = 2147483647
	#The tier of the glyph
	# Default: 1
	# Range: 1 ~ 99
	glyph_tier = 1
	#Limits the number of times a given augment may be applied to a given effect
	#Example entry: "glyph_amplify=5"
	augment_limits = ["ars_nouveau:glyph_split=3", "ars_nouveau:glyph_amplify=3", "ars_nouveau:glyph_dampen=3"]
	#How much an augment should cost when used on this effect or form. This overrides the default cost in the augment config.
	#Example entry: "glyph_amplify=50"
	augment_cost_overrides = []
	#Prevents the given glyph from being used in the same spell as the given glyph
	#Example entry: "glyph_burst"
	invalid_combos = []
	#Multiplier applied to the caster's melee attack damage
	# Default: 0.5
	# Range: 0.0 ~ 100.0
	melee_damage_multiplier = 0.5
	#Damage bonus per Amplify level
	# Default: 0.2
	# Range: 0.0 ~ 10.0
	amplify_multiplier = 0.2
	#Damage penalty per Dampen level
	# Default: 0.2
	# Range: 0.0 ~ 10.0
	dampen_multiplier = 0.2
	#Damage bonus per point of spell power
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	spell_power_scale = 0.1
	#Ticks between each split slash
	# Default: 2
	# Range: 1 ~ 100
	split_interval_ticks = 2
	#Maximum Split augment level; each level grants 2 extra slashes
	# Default: 3
	# Range: 0 ~ 10
	split_max_level = 3
