#General settings
[general]
	#Is Enabled?
	enabled = true
	#Cost
	# Default: 30
	# Range: > -2147483648
	cost = 30
	#Is Starter Glyph?
	starter = false
	#The maximum number of times this glyph may appear in a single spell
	# Default: 2147483647
	# Range: > 1
	per_spell_limit = 2147483647
	#The tier of the glyph
	# Default: 1
	# Range: 1 ~ 99
	glyph_tier = 1
	#Limits the number of times a given augment may be applied to a given effect
	#Example entry: "glyph_amplify=5"
	augment_limits = ["ars_nouveau:glyph_amplify=5", "ars_nouveau:glyph_dampen=5"]
	#How much an augment should cost when used on this effect or form. This overrides the default cost in the augment config.
	#Example entry: "glyph_amplify=50"
	augment_cost_overrides = []
	#Prevents the given glyph from being used in the same spell as the given glyph
	#Example entry: "glyph_burst"
	invalid_combos = []
	#Fraction of the caster's maximum health dealt as damage
	# Default: 0.25
	# Range: 0.0 ~ 100.0
	max_health_damage_multiplier = 0.25
	#Damage bonus per Amplify level
	# Default: 0.2
	# Range: 0.0 ~ 10.0
	amplify_multiplier = 0.2
	#Damage penalty per Dampen level
	# Default: 0.2
	# Range: 0.0 ~ 10.0
	dampen_multiplier = 0.2
	#Damage bonus per point of spell power
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	spell_power_scale = 0.1
	#Current health deducted from the caster when casting
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	health_cost = 1.0
	#Duration of the heartbeat sound effect, in ticks, after which the sound is stopped
	# Default: 15
	# Range: 1 ~ 200
	sound_duration_ticks = 15
