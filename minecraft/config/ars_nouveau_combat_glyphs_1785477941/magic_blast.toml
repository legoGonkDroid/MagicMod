#General settings
[general]
	#Is Enabled?
	enabled = true
	#Cost
	# Default: 100
	# Range: > -2147483648
	cost = 100
	#Is Starter Glyph?
	starter = false
	#The maximum number of times this glyph may appear in a single spell
	# Default: 2147483647
	# Range: > 1
	per_spell_limit = 2147483647
	#The tier of the glyph
	# Default: 1
	# Range: 1 ~ 99
	glyph_tier = 1
	#Limits the number of times a given augment may be applied to a given effect
	#Example entry: "glyph_amplify=5"
	augment_limits = ["ars_nouveau:glyph_sensitive=1", "ars_nouveau:glyph_amplify=3", "ars_nouveau:glyph_aoe=3", "ars_nouveau:glyph_dampen=3"]
	#How much an augment should cost when used on this effect or form. This overrides the default cost in the augment config.
	#Example entry: "glyph_amplify=50"
	augment_cost_overrides = []
	#Prevents the given glyph from being used in the same spell as the given glyph
	#Example entry: "glyph_burst"
	invalid_combos = []
	#Multiplier applied to the caster's maximum mana
	# Default: 0.02
	# Range: 0.0 ~ 100.0
	max_mana_damage_multiplier = 0.02
	#Damage bonus per Amplify level
	# Default: 0.2
	# Range: 0.0 ~ 10.0
	amplify_multiplier = 0.2
	#Damage penalty per Dampen level
	# Default: 0.2
	# Range: 0.0 ~ 10.0
	dampen_multiplier = 0.2
	#Damage bonus per point of spell power
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	spell_power_scale = 0.1
	#Base blast radius in blocks
	# Default: 3.0
	# Range: 1.0 ~ 32.0
	base_radius = 3.0
	#Extra blast radius granted per AOE level
	# Default: 1.0
	# Range: 0.0 ~ 16.0
	radius_per_aoe_level = 1.0
	#Minimum block hardness destroyed when Sensitive is applied
	# Default: 0.0
	# Range: 0.0 ~ 100.0
	sensitive_break_min_hardness = 0.0
	#Maximum block hardness destroyed when Sensitive is applied
	# Default: 50.0
	# Range: 0.0 ~ 100.0
	sensitive_break_max_hardness = 50.0
